name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # The @weld/* packages resolve each other via their built dist/ output
      # (gamebible's types live in dist/index.d.ts). Build it before the other
      # workspaces typecheck, or CI fails with "Cannot find module
      # '@weld/gamebible'" on a clean checkout.
      - name: Build gamebible (types for other workspaces)
        run: npm run build -w @weld/gamebible

      - name: Typecheck (TS)
        run: npm run typecheck

      - name: Unit tests (TS)
        run: npm test

      # Build all workspaces before pytest: the M2 builder shells out to the
      # playtester CLI (packages/playtester/dist/cli.cjs) as the named build
      # step's gate, so the backend tests need that artifact present on a clean
      # checkout. Building here (instead of after) keeps build output available
      # to both pytest and the e2e step that follows.
      - name: Build (sample game + web)
        run: npm run build

      - name: API unit tests (pytest, hermetic SQLite)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          cd backend && python -m pytest

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        # Fail fast rather than hang forever if a server refuses to boot.
        timeout-minutes: 15
        run: npm run e2e
