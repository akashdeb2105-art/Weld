name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # The @weld/* packages resolve each other via their built dist/ output
      # (gamebible's types live in dist/index.d.ts). Build it before the other
      # workspaces typecheck, or CI fails with "Cannot find module
      # '@weld/gamebible'" on a clean checkout.
      - name: Build gamebible (types for other workspaces)
        run: npm run build -w @weld/gamebible

      - name: Typecheck (TS)
        run: npm run typecheck

      - name: Unit tests (TS)
        run: npm test

      # The M2 builder shells out to the playtester CLI
      # (packages/playtester/dist/cli.cjs) as its build gate, and the root
      # `npm run build` does NOT build that workspace. The TS unit tests above
      # already built @weld/engine (esbuild inlines it into the bundled CLI),
      # so this one step is enough to give the backend tests the artifact.
      - name: Build playtester (CLI for the API build gate)
        run: npm run build -w @weld/playtester

      - name: API unit tests (pytest, hermetic SQLite)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          cd backend && python -m pytest

      # Cache the Next.js incremental build output so unchanged code reuses
      # prior compile artifacts (webpack cache, SWC) instead of tracing the
      # standalone output from scratch — that trace dominated the cold runs.
      # Keyed on package-lock + all source; any change to either rebuilds.
      - name: Cache Next.js build output
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('frontend/**', 'packages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # Cache the Playwright browser binaries (~400MB download) keyed on the
      # installed Playwright version; only re-downloads when the version bumps.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Build (sample game + web)
        run: npm run build

      - name: Install Playwright browsers
        # `--with-deps` re-installs OS libs; skip it on a cache hit (they're
        # already present) and only fill in missing browser binaries.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        # Fail fast rather than hang forever if a server refuses to boot.
        timeout-minutes: 15
        run: npm run e2e

  # Production deploy. Runs only on a push to main and only after `quality` is
  # green — CI is the sole path to prod (Render autoDeploy and Netlify
  # auto-publish are both off). Backend first so migrations land before the
  # frontend rebuilds against the API.
  #
  # Required repo config:
  #   secrets.RENDER_DEPLOY_HOOK   Render service "Deploy Hook" URL
  #   secrets.NETLIFY_BUILD_HOOK   Netlify "Build hook" URL
  #   vars.WELD_API_URL            e.g. https://weld-api.onrender.com
  #   vars.WELD_SITE_URL           e.g. https://weld.netlify.app
  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend (Render)
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "${{ vars.WELD_API_URL }}/health" | grep -q '"status":"ok"'; then
              echo "backend healthy"; exit 0
            fi
            echo "waiting for backend ($i/60)..."; sleep 10
          done
          echo "backend did not report healthy in 10 minutes"; exit 1

      - name: Deploy frontend (Netlify)
        run: curl -fsSL -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"

      - name: Smoke test backend
        run: curl -fsS "${{ vars.WELD_API_URL }}/api/v1/projects" | grep -q scrap-sprint

      - name: Smoke test frontend
        # The Netlify build runs a few minutes after the hook fires; poll until
        # the site answers 200 (it can briefly 5xx during the deploy swap).
        run: |
          for i in $(seq 1 40); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "${{ vars.WELD_SITE_URL }}/" || true)
            if [ "$code" = "200" ]; then echo "frontend up"; exit 0; fi
            echo "waiting for frontend ($i/40, last=$code)..."; sleep 15
          done
          echo "frontend did not return 200 within 10 minutes"; exit 1
