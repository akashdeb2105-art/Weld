name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # The @weld/* packages resolve each other via their built dist/ output
      # (gamebible's types live in dist/index.d.ts). Build it before the other
      # workspaces typecheck, or CI fails with "Cannot find module
      # '@weld/gamebible'" on a clean checkout.
      - name: Build gamebible (types for other workspaces)
        run: npm run build -w @weld/gamebible

      - name: Typecheck (TS)
        run: npm run typecheck

      - name: Unit tests (TS)
        run: npm test

      # The M2 builder shells out to the playtester CLI
      # (packages/playtester/dist/cli.cjs) as its build gate, and the root
      # `npm run build` does NOT build that workspace. The TS unit tests above
      # already built @weld/engine (esbuild inlines it into the bundled CLI),
      # so this one step is enough to give the backend tests the artifact.
      - name: Build playtester (CLI for the API build gate)
        run: npm run build -w @weld/playtester

      - name: API unit tests (pytest, hermetic SQLite)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          cd backend && python -m pytest

      # Cache the Next.js incremental build output so unchanged code reuses
      # prior compile artifacts (webpack cache, SWC) instead of tracing the
      # standalone output from scratch — that trace dominated the cold runs.
      # Keyed on package-lock + all source; any change to either rebuilds.
      - name: Cache Next.js build output
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('frontend/**', 'packages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # Cache the Playwright browser binaries (~400MB download) keyed on the
      # installed Playwright version; only re-downloads when the version bumps.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Build (sample game + web)
        run: npm run build

      - name: Install Playwright browsers
        # `--with-deps` re-installs OS libs; skip it on a cache hit (they're
        # already present) and only fill in missing browser binaries.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        # Fail fast rather than hang forever if a server refuses to boot.
        timeout-minutes: 15
        run: npm run e2e
