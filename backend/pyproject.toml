[project]
name = "weld-api"
version = "0.1.0"
description = "WELD API — projects, GameBibles, jobs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # director.py imports httpx unconditionally at module load for the real
    # LLM provider calls — it is a runtime dep, not a test-only one.
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Convenience scripts surfaced via npm (`npm run e2e:serve -w @weld/api`).
[tool.weld]
e2e_serve = "uvicorn app.main:app --host 127.0.0.1 --port ${WELD_API_PORT:-8871}"
