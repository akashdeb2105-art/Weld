services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weld-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-weld}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-weld}']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-weld}:${POSTGRES_PASSWORD:-weld-dev-only}@postgres:5432/${POSTGRES_DB:-weld}
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        WELD_API_URL: http://api:8000
    environment:
      WELD_API_URL: http://api:8000
      WELD_SITE_URL: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
